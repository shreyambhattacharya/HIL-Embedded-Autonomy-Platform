# ROS 2 <-> Gazebo Harmonic bridge for Milestone 1.
# Only the plant boundary and required sensors are bridged here.

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /hil/sensors/wheel_states
  gz_topic_name: /hil/gz/wheel_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /hil/sensors/imu
  gz_topic_name: /hil/gz/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  frame_id: imu_link
  qos_profile: SENSOR_DATA

- ros_topic_name: /hil/sensors/scan
  gz_topic_name: /hil/gz/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
  frame_id: lidar_link
  qos_profile: SENSOR_DATA

- ros_topic_name: /hil/ground_truth/odom
  gz_topic_name: /hil/gz/ground_truth/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /hil/actuator/left_effort
  gz_topic_name: /model/hil_rover/joint/left_wheel_joint/cmd_force
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /hil/actuator/right_effort
  gz_topic_name: /model/hil_rover/joint/right_wheel_joint/cmd_force
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
