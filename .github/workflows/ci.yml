name: Build and unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ros-build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Build workspace and run package tests
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          import-token: ${{ secrets.GITHUB_TOKEN }}
          package-name: hil_control_stub hil_description hil_pi_runtime hil_serial_bridge hil_simulation hil_autonomy
          target-ros2-distro: jazzy
          colcon-defaults: |
            {
              "build": {
                "symlink-install": true,
                "cmake-args": ["-DBUILD_TESTING=ON"]
              }
            }

      - name: Build and test portable protocol/control libraries
        run: |
          cmake -S common -B common/build-host -DCMAKE_BUILD_TYPE=Debug
          cmake --build common/build-host --parallel
          ctest --test-dir common/build-host --output-on-failure

      - name: Run characterization tooling unit tests
        run: python3 -m unittest discover -s tools/tests -v

      # Gazebo integration remains a local/manual gate. Hosted runners do not
      # provide a sufficiently reliable graphics/runtime environment for this
      # characterization to be a useful merge signal.
